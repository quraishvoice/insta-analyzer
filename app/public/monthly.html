<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التقرير الشهري</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="/theme.js"></script>
<script src="/i18n-labels.js"></script>
<script src="/i18n.js"></script>
<script src="/i18n/monthly.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --surface-2: #f0efeb; --border: #e3e1dc;
  --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984;
  --accent: #2a78d6; --accent-soft: #e3eefb;
  --good: #1f7a3a; --good-soft: #e3f3e7; --bad: #b3261e; --bad-soft: #fbe6e4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #2f2f2c;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8d8c85;
    --accent: #3987e5; --accent-soft: #1d2d42;
    --good: #5cc27a; --good-soft: #1b2e21; --bad: #ef7a72; --bad-soft: #3a1f1d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; font-size: 15px; line-height: 1.65; }
button, select { font: inherit; color: inherit; }
.tools { max-width: 860px; margin: 0 auto; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools a { color: var(--accent); text-decoration: none; margin-inline-end: auto; }
.btn, select { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 7px 14px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.page { max-width: 860px; margin: 0 auto 48px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px 36px; }
h1 { font-size: 24px; margin: 0; }
h2 { font-size: 17px; margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); break-after: avoid; }
.sub { color: var(--text-2); margin: 2px 0 0; }
.muted { color: var(--muted); font-size: 13px; }
.summary { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; margin-top: 18px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.kpi { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; break-inside: avoid; }
.kpi .l { color: var(--text-2); font-size: 13px; }
.kpi .v { font-size: 22px; font-weight: 700; line-height: 1.3; }
.kpi .d { font-size: 12.5px; }
.up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }
ol.steps { margin: 0; padding-inline-start: 22px; display: grid; gap: 10px; }
ol.steps li { break-inside: avoid; }
ol.steps b { display: block; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.two ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 4px; }
.post { border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; break-inside: avoid; }
.post .tag { font-size: 12px; background: var(--surface-2); border-radius: 99px; padding: 1px 9px; margin-inline-start: 6px; }
.post a { color: inherit; text-decoration: none; }
.foot { margin-top: 28px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--border); padding-top: 10px; }
.loading { text-align: center; color: var(--text-2); padding: 60px 0; }
@media (max-width: 640px) {
  .page { padding: 20px 16px; border-radius: 0; border-inline: 0; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .two { grid-template-columns: 1fr; }
}
@page { size: A4; margin: 12mm; }
@media print {
  :root, :root[data-theme] { color-scheme: light; --bg: #fff; --surface: #fff; --surface-2: #f0efeb; --border: #dddbd5; --text: #0b0b0b; --text-2: #52514e; --muted: #77766f; --accent: #2a78d6; --accent-soft: #eef4fc; --good: #1f7a3a; --bad: #b3261e; }
  .tools { display: none; }
  body { font-size: 12.5px; }
  .page { border: 0; padding: 0; margin: 0; max-width: none; }
  .kpi .v { font-size: 18px; }
}
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: start; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--text-2); font-weight: 500; font-size: 13px; }
tr.cur td { font-weight: 700; background: var(--accent-soft); }
.bar { display: inline-block; height: 8px; border-radius: 0 4px 4px 0; background: var(--accent); vertical-align: middle; margin-inline-start: 8px; min-width: 2px; }
.scroll { overflow-x: auto; }
.goal { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.goal:last-child { border-bottom: 0; }
.chip { font-size: 12.5px; padding: 1px 9px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--text-2); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.note { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }
[dir="ltr"] .bar { border-radius: 4px 0 0 4px; }
@media print { tr.cur td { background: #eef4fc; } .bar { background: #2a78d6; } }
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="tools">
  <a href="/">→ اللوحة</a>
  <select id="account" aria-label="الحساب"></select>
  <button class="btn" id="prev">‹ الشهر السابق</button>
  <button class="btn" id="next">الشهر التالي ›</button>
  <button class="btn primary" onclick="print()">حفظ PDF</button>
  <button class="btn" data-lang-toggle>EN</button>
    <button class="btn" data-theme-toggle>🌙</button>
</div>
<div class="page" id="page"><div class="loading">جاري تجهيز التقرير…</div></div>

<script>
const $ = (s) => document.querySelector(s);
const EN = window.LANG === "en";
const nf = new Intl.NumberFormat(EN ? "en-US" : "ar-SA-u-nu-latn-ca-gregory");
const num = (x, d = 0) => (x == null ? "—" : nf.format(Math.round(x * 10 ** d) / 10 ** d));
const pct = (x) => (x == null ? "—" : num(x * 100) + L("٪", "%"));
// يرجّع للدخول لو انتهت جلسة الجوال، ويرمي برسالة الخطأ
async function getJSON(url) {
  const res = await fetch(url);
  if (res.status === 401) { location.href = "/login.html"; throw new Error(L("سجّل دخول", "Please sign in")); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || L("صار خطأ", "Something went wrong"));
  return data;
}
const run = () => load().catch((e) => ($("#page").innerHTML = `<p class="loading">${L("ما قدرت أجهز التقرير", "Couldn’t build the report")}: ${esc(e.message)}</p>`));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TZ = "Asia/Riyadh";
const shift = (m, k) => new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7) - 1 + k, 1)).toISOString().slice(0, 7);
const thisMonth = () => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date()).slice(0, 7);
const dayName = (d) => new Date(d + "T12:00:00Z").toLocaleDateString(EN ? "en-US" : "ar-SA-u-nu-latn-ca-gregory", { day: "numeric", month: "long", timeZone: "UTC" });
// اسم الشهر: بالعربي من الخادم كما هو، وبالإنجليزي من رمز الشهر (2026-09)
const monName = (code, arName, full = true) => (EN ? new Date(code + "-15T12:00:00Z").toLocaleDateString("en-US", full ? { month: "long", year: "numeric", timeZone: "UTC" } : { month: "long", timeZone: "UTC" }) : full ? arName : arName.split(" ")[0]);

// الافتراضي: آخر شهر مكتمل
const params = new URLSearchParams(location.search);
const state = { id: params.get("id"), month: /^\d{4}-\d{2}$/.test(params.get("month") || "") ? params.get("month") : shift(thisMonth(), -1) };

function delta(cur, prev, label) {
  if (cur == null || prev == null || prev === 0) return `<span class="d flat">${L("ما فيه مقارنة", "No comparison")}</span>`;
  const diff = ((cur - prev) / Math.abs(prev)) * 100;
  if (Math.abs(diff) < 0.5) return `<span class="d flat">${L(`— نفس ${label}`, `— No change vs ${label}`)}</span>`;
  return `<span class="d ${diff > 0 ? "up" : "down"}">${diff > 0 ? "▲" : "▼"} ${L(`${num(Math.abs(diff))}٪ عن ${label}`, `${num(Math.abs(diff))}% vs ${label}`)}</span>`;
}
const signed = (x) => (x == null ? "—" : (x > 0 ? "+" : "") + num(x));
const first = (c) => { const l = (c || "").split("\n").find((x) => x.trim())?.trim() || ""; return esc(l.length > 90 ? l.slice(0, 90).replace(/\s+\S*$/, "") + "…" : l) || L("بدون كابشن", "No caption"); };
const secs = (x) => (x == null ? "—" : x >= 60 ? `${Math.floor(x / 60)}:${String(Math.round(x % 60)).padStart(2, "0")} ${L("د", "min")}` : `${num(x)}${L(" ث", "s")}`);

async function load() {
  const accounts = await getJSON("/api/accounts");
  const live = accounts.filter((a) => !a.is_demo);
  if (!state.id || !accounts.some((a) => a.id === state.id)) state.id = (live[0] || accounts[0])?.id;
  $("#account").innerHTML = accounts.map((a) => `<option value="${esc(a.id)}">@${esc(a.username)}${a.is_demo ? L(" (تجريبي)", " (demo)") : ""}</option>`).join("");
  $("#account").value = state.id;
  if (!state.id) return ($("#page").innerHTML = `<p class="loading">${L("ما فيه حسابات مربوطة.", "No accounts connected.")}</p>`);
  history.replaceState(null, "", `?id=${encodeURIComponent(state.id)}&month=${state.month}`);
  $("#next").disabled = state.month >= thisMonth();
  $("#page").innerHTML = `<div class="loading">${L("جاري تجهيز التقرير…", "Preparing report…")}</div>`;
  const M = await getJSON(`/api/accounts/${encodeURIComponent(state.id)}/monthly?month=${state.month}`);
  render(M);
}

function render(M) {
  const r = M.report, k = r.kpis, pk = r.prev_kpis, a = r.account, adv = r.advice;
  const sl = r.sales.kpis, psl = r.sales.prev_kpis, cm = r.comments.kpis, pcm = r.comments.prev_kpis, st = r.stories.kpis, pst = r.stories.prev_kpis;
  const prevShort = monName(M.prev_month, M.prev_name, false);
  const monthFull = monName(M.month, M.month_name), monthShort = monName(M.month, M.month_name, false);
  const vs = M.partial ? L(`نفس الأيام من ${prevShort}`, `the same days in ${prevShort}`) : prevShort;
  const kpi = (label, cur, prev, fmt = num) => `<div class="kpi"><div class="l">${label}</div><div class="v">${fmt(cur)}</div>${delta(cur, prev, vs)}</div>`;
  document.title = `${L("التقرير الشهري", "Monthly report")} · @${a.username} · ${M.month}`;

  const best = r.top.slice(0, 3), weak = r.bottom[0], seller = r.sales.top_posts[0];
  const postBox = (label, p, extra) => p ? `<div class="post"><b>${label}</b><span class="tag">${esc(p.kind_name)}</span>
    <div><a href="${esc(p.permalink)}" target="_blank" rel="noopener" data-notr>${L(`«${first(p.caption)}»`, `“${first(p.caption)}”`)}</a></div>
    <div class="muted">${L(`الوصول ${num(p.reach)} · المشاهدات ${num(p.views)} · الحفظ ${num(p.saved)} · المشاركات ${num(p.shares)}`, `Reach ${num(p.reach)} · Views ${num(p.views)} · Saves ${num(p.saved)} · Shares ${num(p.shares)}`)}${extra || ""}</div></div>` : "";

  // آخر ٦ شهور
  const maxReach = Math.max(1, ...M.months.map((x) => x.avg_reach || 0));
  const hasSales = M.months.some((x) => x.sales);
  const trend = `<div class="scroll"><table><thead><tr><th>${L("الشهر", "Month")}</th><th>${L("البوستات", "Posts")}</th><th>${L("متوسط الوصول للبوست", "Avg. reach per post")}</th><th>${L("المشاهدات", "Views")}</th><th>${L("سألوا عن السعر", "Price inquiries")}</th>${hasSales ? `<th>${L("التسجيلات", "Sign-ups")}</th>` : ""}</tr></thead>
    <tbody>${M.months.map((x) => `<tr class="${x.month === M.month ? "cur" : ""}"><td>${esc(monName(x.month, x.name, false))}</td><td>${num(x.posts)}</td>
      <td>${num(x.avg_reach)}<span class="bar" style="width:${Math.round(((x.avg_reach || 0) / maxReach) * 90)}px" aria-hidden="true"></span></td>
      <td>${num(x.views)}</td><td>${num(x.leads)}</td>${hasSales ? `<td>${num(x.sales)}</td>` : ""}</tr>`).join("")}</tbody></table></div>
    ${M.partial ? `<p class="note">${L(`${esc(M.month_name.split(" ")[0])} لين اليوم بس.`, `${esc(monthShort)} through today only.`)}</p>` : ""}`;

  const R = M.reels, PR = M.prev_reels;
  const reels = R.count ? `<div class="kpis">
      <div class="kpi"><div class="l">${L("الريلز", "Reels")}</div><div class="v">${num(R.count)}</div>${delta(R.count, PR.count, vs)}</div>
      <div class="kpi"><div class="l">${L("متوسط مدة المشاهدة", "Avg. watch time")}</div><div class="v">${num(R.watch, 1)}${L(" ث", "s")}</div>${delta(R.watch, PR.watch, vs)}</div>
      ${R.ret != null ? `<div class="kpi"><div class="l">${L("كم شافوا من الريل", "Avg. % watched")}</div><div class="v">${pct(R.ret)}</div>${delta(R.ret, PR.ret, vs)}</div>` : ""}
      ${R.duration != null ? `<div class="kpi"><div class="l">${L("طول الريل بالمتوسط", "Avg. reel length")}</div><div class="v">${secs(R.duration)}</div><span class="d flat">${L(`${num(R.under_minute)} من ${num(R.count)} أقل من دقيقة`, `${num(R.under_minute)} of ${num(R.count)} under a minute`)}</span></div>` : ""}
    </div>` : `<p class="sub">${L("ما نزّلت ريلز هالشهر.", "No reels posted this month.")}</p>`;

  const G = M.goals;
  const goalAmt = (x, g) => `${num(x)}${g.metric === "revenue" ? L(" ريال", " SAR") : ""}`;
  const goals = G.goals.length ? G.goals.map((g) => `<div class="goal"><span><b>${esc(g.name)}</b>: ${L(`${goalAmt(g.actual, g)} من ${goalAmt(g.target, g)}`, `${goalAmt(g.actual, g)} of ${goalAmt(g.target, g)}`)}</span>
      <span class="chip ${g.actual >= g.target ? "good" : M.partial ? "" : "bad"}">${g.actual >= g.target ? L("تحقق ✓", "Hit ✓") : M.partial ? pct(g.progress) : L(`${pct(g.progress)} منه`, `${pct(g.progress)} reached`)}</span></div>`).join("") : "";

  const V = { won: ["good", L("نفعت ✓", "Worked ✓")], lost: ["bad", L("ما نفعت", "Didn’t work")], same: ["", L("ما فرقت", "No difference")], early: ["", L("ما فيه بوستات كفاية", "Not enough posts")] };
  const exps = M.experiments.map((e) => `<div class="post"><b data-notr>${esc(e.name)}</b> <span class="chip ${V[e.verdict][0]}">${V[e.verdict][1]}</span>
      <div class="muted">${L(`من ${dayName(e.start)} إلى ${dayName(e.end)}`, `${dayName(e.start)} – ${dayName(e.end)}`)}</div><div>${esc(e.text)}</div>${e.advice ? `<div><b>${esc(e.advice)}</b></div>` : ""}</div>`).join("");

  $("#page").innerHTML = `
    <h1>${L("التقرير الشهري", "Monthly report")} · ${esc(monthFull)}</h1>
    <p class="sub">@${esc(a.username)} · ${M.partial ? L(`من ${dayName(r.period.from)} لين ${dayName(M.to)} (الشهر ما خلص)`, `${dayName(r.period.from)} – ${dayName(M.to)} (month in progress)`) : L(`الشهر كامل، مقارنة مع ${esc(M.prev_name)}`, `Full month, compared with ${esc(monName(M.prev_month, M.prev_name))}`)}</p>
    <div class="summary">${esc(M.summary)}</div>

    <h2>${L("الأرقام", "Key numbers")}</h2>
    <div class="kpis">
      ${kpi(L("البوستات", "Posts"), k.posts, pk.posts)}
      ${kpi(L("إجمالي الوصول", "Total reach"), k.reach, pk.reach)}
      ${kpi(L("متوسط الوصول للبوست", "Avg. reach per post"), k.avg_reach, pk.avg_reach)}
      ${kpi(L("نمو المتابعين", "Follower growth"), k.follower_growth, pk.follower_growth, signed)}
      ${kpi(L("زيارات البروفايل", "Profile visits"), k.profile_visits, pk.profile_visits)}
      ${kpi(L("الستوري", "Stories"), st.count, pst.count)}
      ${kpi(L("سألوا عن السعر أو التسجيل", "Asked about price or sign-up"), cm.leads, pcm.leads)}
      ${sl.revenue != null || psl.revenue != null
        ? kpi(L("المسجلين · الإيراد", "Sign-ups · Revenue"), sl.count, psl.count, (x) => `${num(x)}${x === sl.count && sl.revenue != null ? ` <span class="muted">· ${num(sl.revenue)} ${L("ريال", "SAR")}</span>` : ""}`)
        : kpi(L("المسجلين", "Sign-ups"), sl.count, psl.count)}
    </div>
    ${M.followers_note ? `<p class="note">${esc(M.followers_note)}</p>` : ""}

    <h2>${L("آخر ٦ شهور", "Last 6 months")}</h2>
    ${trend}

    <h2>${L("الريلز", "Reels")}</h2>
    ${reels}

    ${goals ? `<h2>${L(`أهداف ${esc(M.month_name.split(" ")[0])}`, `${esc(monthShort)} goals`)}</h2>${goals}` : ""}

    ${best.length ? `<h2>${L("بوستات الشهر", "Posts of the month")}</h2>
      ${best.map((p, i) => postBox(i === 0 ? L("الأعلى في الاهتمام", "Highest interest") : i === 1 ? L("الثاني", "2nd") : L("الثالث", "3rd"), p)).join("")}
      ${seller && !best.some((p) => p.id === seller.id) ? postBox(L("أكثر بوست جاب تسجيلات", "Most sign-ups"), seller, L(` · ${num(seller.attributed, seller.attributed % 1 ? 1 : 0)} مسجل`, ` · ${num(seller.attributed, seller.attributed % 1 ? 1 : 0)} ${seller.attributed === 1 ? "sign-up" : "sign-ups"}`)) : ""}
      ${weak && !best.some((p) => p.id === weak.id) ? postBox(L("أضعف بوست", "Weakest post"), weak) : ""}` : ""}

    ${exps ? `<h2>${L("التجارب اللي خلصت هالشهر", "Experiments finished this month")}</h2>${exps}` : ""}

    <div class="two">
      <div><h2 style="color:var(--good)">${L("✓ وش ماشي صح", "✓ What’s working")}</h2>${adv.wins.length ? `<ul>${adv.wins.slice(0, 5).map((w) => `<li>${esc(w)}</li>`).join("")}</ul>` : `<p class="sub">${L("ما فيه شي بارز.", "Nothing stood out.")}</p>`}</div>
      <div><h2 style="color:var(--bad)">${L("! وش يحتاج تحسين", "! What needs work")}</h2>${adv.problems.length ? `<ul>${adv.problems.slice(0, 5).map((w) => `<li>${esc(w)}</li>`).join("")}</ul>` : `<p class="sub">${L("ما فيه مشاكل واضحة.", "No clear problems.")}</p>`}</div>
    </div>

    <h2>${L(`أهم ${adv.recommendations.length >= 3 ? "٣ خطوات" : "الخطوات"} ${M.partial ? "لباقي الشهر" : "للشهر الجاي"}`, `${adv.recommendations.length >= 3 ? "Top 3 steps" : "Top steps"} ${M.partial ? "for the rest of the month" : "for next month"}`)}</h2>
    ${adv.recommendations.length ? `<ol class="steps">${adv.recommendations.slice(0, 3).map((x) => `<li><b>${esc(x.title)}</b>${esc(x.detail)}</li>`).join("")}</ol>` : `<p class="sub">${L("ما فيه توصيات عاجلة. كمّل على نفس الخط.", "Nothing urgent. Keep doing what you’re doing.")}</p>`}

    <div class="foot">${L(`من محلل انستجرام · الأرقام من Meta، والتسجيلات من إدخالك · المقارنة مع ${dayName(M.prev.from)} – ${dayName(M.prev.to)}`, `From Instagram Analyzer · Numbers from Meta, sign-ups from your entries · Compared with ${dayName(M.prev.from)} – ${dayName(M.prev.to)}`)}</div>`;
}

$("#account").onchange = (e) => { state.id = e.target.value; run(); };
$("#prev").onclick = () => { state.month = shift(state.month, -1); run(); };
$("#next").onclick = () => { state.month = shift(state.month, 1); run(); };
run();
</script>
</body>
</html>
